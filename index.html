<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MAPA ELECTORAL 2023</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PapaParse para CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="map"></div>

<script>
// -----------------------------------
// 1) Inicializar mapa
// -----------------------------------
var map = L.map('map').setView([41.47, 2.08], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);


// -----------------------------------
// 2) URL del Google Sheets → CSV
// (SUSTITUIR ID_DE_TU_HOJA)
// -----------------------------------
var urlCSV =
  "https://docs.google.com/spreadsheets/d/gid=2001682057/export?format=csv&gid=1443106934";


// -----------------------------------
// 3) Leer Google Sheets y devolver diccionario {codiseccio → fila}
// -----------------------------------
function cargarDatosGoogleSheets() {
  return fetch(urlCSV)
    .then(r => r.text())
    .then(csv => {
      var parsed = Papa.parse(csv, { header: true }).data;

      var dic = {};
      parsed.forEach(row => {
  // Buscar una columna cuyo nombre, en minúsculas, sea exactamente "codiseccio"
  let key = Object.keys(row).find(k => k.toLowerCase().trim() === "codiseccio");

  if (key && row[key]) {
    let codigo = String(row[key]).trim();
    dic[codigo] = row;
  }
});


      console.log("Datos Google Sheets:", dic);
      return dic;
    });
}


// -----------------------------------
// 4) Cargar GeoJSON y fusionar datos
// -----------------------------------
fetch('result.geojson')
  .then(r => {
    if (!r.ok) throw new Error("No puc llegir result.geojson");
    return r.json();
  })
  .then(async function(data) {

    // 4.1 cargar datos del Sheet
    var datos = await cargarDatosGoogleSheets();

    // 4.2 crear capa GeoJSON
    var layer = L.geoJSON(data, {
      style: function(feature) {
        return {
          color: '#555',
          weight: 1,
          fillColor: '#cccccc',
          fillOpacity: 0.5
        };
      },
      onEachFeature: function(feature, layer) {
        var props = feature.properties || {};
        var id = String(props.codiseccio).trim();

        // fusionar datos de la hoja si existen
        if (datos[id]) {
          Object.assign(props, datos[id]); 
        }

        // Crear popup
        var html = `<strong>Secció ${id}</strong><br>
                    Districte: ${props.districte || ""} (${props.nomdistricte || ""})<br>
                    Secció: ${props.seccio || ""}<br><br>`;

        if (datos[id]) {
          html += "<strong>Dades Google Sheets:</strong><br>";
          for (let key in datos[id]) {
            html += `${key}: ${datos[id][key]}<br>`;
          }
        } else {
          html += "<em>Sense dades al Google Sheets</em>";
        }

        layer.bindPopup(html);
      }
    }).addTo(map);

    map.fitBounds(layer.getBounds());
  })
  .catch(err => {
    console.error(err);
    alert("Error carregant el GeoJSON: " + err.message);
  });

</script>

</body>
</html>
